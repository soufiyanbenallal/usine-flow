name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          # The build must work without secrets; the app shows a configuration notice when these are empty.
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""

  database:
    name: Database (migrations, RLS, triggers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL tests
        run: bash supabase/tests/run.sh

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for tokens / service keys
        run: |
          # Fail on well-known secret shapes. Publishable/anon keys are public by design and allowed.
          if git grep -nE "(figd_[A-Za-z0-9_-]{20,}|sbp_[a-f0-9]{30,}|service_role[\"' ]*[:=][\"' ]*eyJ|sk_live_[A-Za-z0-9]{10,}|ghp_[A-Za-z0-9]{30,})" -- . ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "::error::Possible secret committed"; exit 1
          fi
